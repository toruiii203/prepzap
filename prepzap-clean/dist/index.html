    <!-- Material Symbols fallback: hide icon glyphs until the font actually loads,
         so a failed/slow font request shows nothing instead of raw text like
         "home", "play_circle", "school". Falls back to visible after 2s max
         so icons never stay hidden forever if the Fonts API is unsupported. -->
    <style>
      .material-symbols-outlined {
        font-family: 'Material Symbols Outlined';
        font-weight: normal;
        font-style: normal;
        font-size: 24px;
        line-height: 1;
        letter-spacing: normal;
        text-transform: none;
        display: inline-block;
        white-space: nowrap;
        word-wrap: normal;
        direction: ltr;
        -webkit-font-smoothing: antialiased;
        visibility: hidden;
      }
      .fonts-loaded .material-symbols-outlined {
        visibility: visible;
      }
    </style>

  <body>
    <div id="root" vaul-drawer-wrapper=""></div>

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('SW registered:', reg.scope))
            .catch(err => console.warn('SW registration failed:', err));
        });
      }
    </script>

    <!-- Reveal icons once the Material Symbols font is actually ready -->
    <script>
      (function () {
        function reveal() {
          document.documentElement.classList.add('fonts-loaded');
        }
        if ('fonts' in document) {
          document.fonts.load('24px "Material Symbols Outlined"').finally(reveal);
          // Safety net: never leave icons hidden more than 2s even if load() hangs
          setTimeout(reveal, 2000);
        } else {
          // Fonts API unsupported (old browsers) — just show icons immediately
          reveal();
        }
      })();
    </script>
  </body>
