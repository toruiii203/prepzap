    <!-- Static Skeleton Logic -->
    <script>
      try {
        var p = window.location.pathname;
        var a = ['/dashboard', '/notes', '/ai-tutor', '/flashcards', '/practice', '/timer', '/planner', '/math', '/teach-it', '/quick-study', '/sources', '/mistakes', '/analytics', '/challenges', '/arena'];
        var isApp = a.some(function(r) { return p.startsWith(r); });
        var hasS = localStorage.getItem('pz-auth-storage');
        if (isApp && hasS) {
          document.documentElement.classList.add('show-app-skeleton');
        }
      } catch(e) {}
    </script>

      html, body { background: #FAF7F2; margin: 0; padding: 0; }

        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')

            .catch(err => console.warn('SW registration failed:', err));
        });

    <!-- Reveal icons once the Material Symbols font is actually ready -->
    <script>
      (function () {
        function reveal() {
          document.documentElement.classList.add('fonts-loaded');
        }
        if ('fonts' in document) {
          document.fonts.load('24px "Material Symbols Outlined"').finally(reveal);
          // Safety net: never leave icons hidden more than 2s even if load() hangs
          setTimeout(reveal, 2000);
        } else {
          // Fonts API unsupported (old browsers) — just show icons immediately
          reveal();
        }
      })();
    </script>
