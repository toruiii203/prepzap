<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#0A0A0C"/>
  <!-- Multi-line Z logo matching the PrepZap logo -->
  <g stroke="white" stroke-linecap="round" fill="none">
    <!-- Top horizontal lines -->
    <line x1="25" y1="22" x2="72" y2="22" stroke-width="3.2"/>
    <line x1="25" y1="27" x2="67" y2="27" stroke-width="2.8"/>
    <line x1="25" y1="32" x2="62" y2="32" stroke-width="2.4"/>
    <line x1="25" y1="37" x2="57" y2="37" stroke-width="2.0"/>
    <!-- Diagonal lines -->
    <line x1="72" y1="22" x2="28" y2="78" stroke-width="3.2"/>
    <line x1="67" y1="27" x2="33" y2="73" stroke-width="2.8"/>
    <line x1="62" y1="32" x2="38" y2="68" stroke-width="2.4"/>
    <line x1="57" y1="37" x2="43" y2="63" stroke-width="2.0"/>
    <!-- Bottom horizontal lines -->
    <line x1="28" y1="78" x2="75" y2="78" stroke-width="3.2"/>
    <line x1="33" y1="73" x2="75" y2="73" stroke-width="2.8"/>
    <line x1="38" y1="68" x2="75" y2="68" stroke-width="2.4"/>
    <line x1="43" y1="63" x2="75" y2="63" stroke-width="2.0"/>
  </g>
</svg>
