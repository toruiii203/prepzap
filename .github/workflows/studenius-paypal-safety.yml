name: Studenius PayPal safety verification
on:
  push:
    branches:
      - fix/studenius-paypal-safety-20261113
  pull_request:
    paths:
      - 'prepzap-clean/src/pages/UsePro.tsx'
      - 'prepzap-clean/backend-worker/**'
      - 'prepzap-clean/src/test/paypalSecurity.test.ts'
      - 'prepzap-clean/src/test/paypalSandbox.test.ts'
      - 'prepzap-clean/functions/api/paypal-sandbox.ts'
      - 'functions/api/paypal-sandbox.ts'
      - '.github/workflows/studenius-paypal-safety.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: prepzap-clean
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: prepzap-clean/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: PayPal webhook and sandbox security regressions
        run: npx vitest run src/test/paypalSecurity.test.ts src/test/paypalSandbox.test.ts
      - name: Production web build
        run: npm run build
